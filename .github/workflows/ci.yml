name: Krnl-AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/KrnlAI.Desktop.App/KrnlAI.Desktop.App.csproj --configuration Release
      - run: dotnet test tests/KrnlAI.Desktop.Tests/KrnlAI.Desktop.Tests.csproj --configuration Release

  vsix-extensibility:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/KrnlAI.VisualStudio.Extensibility/KrnlAI.VisualStudio.Extensibility.csproj --configuration Release
      - run: dotnet test tests/KrnlAI.VisualStudio.Extensibility.Tests/KrnlAI.VisualStudio.Extensibility.Tests.csproj --configuration Release

  sidecar:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/KrnlAI.Sidecar/KrnlAI.Sidecar.csproj --configuration Release
      - run: dotnet test tests/KrnlAI.Sidecar.Tests/KrnlAI.Sidecar.Tests.csproj --configuration Release

  tauri:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sidecar for externalBin
        run: |
          dotnet publish src/KrnlAI.Sidecar/KrnlAI.Sidecar.csproj -r linux-x64 --self-contained -c Release -p:SignAssembly=false -o src/KrnlAI.Desktop.Tauri/src-tauri/binaries
          cp src/KrnlAI.Desktop.Tauri/src-tauri/binaries/KrnlAI.Sidecar src/KrnlAI.Desktop.Tauri/src-tauri/binaries/krnlai-sidecar-x86_64-unknown-linux-gnu
      - name: Cargo test
        run: cargo test --manifest-path src/KrnlAI.Desktop.Tauri/src-tauri/Cargo.toml

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd src/KrnlAI.BrowserExtension
          npm ci
          npm run lint
          npm run build

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd src/KrnlAI.VsCode
          npm ci
          npx tsc
      - run: |
          cd src/KrnlAI.VsCode
          npx jest --ci
      - name: Package VS Code extension (gate)
        run: |
          cd src/KrnlAI.VsCode
          npm run build:bundle
          npx @vscode/vsce package --no-dependencies -o krnlai-vscode-gate.vsix

  test-community:
    needs: [desktop, vsix-extensibility, sidecar, tauri, browser-extension, vscode]
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/KrnlAI.Community.Tests/KrnlAI.Community.Tests.csproj --configuration Release
      - run: dotnet test tests/KrnlAI.Cli.Tests/KrnlAI.Cli.Tests.csproj --configuration Release
      - run: dotnet test tests/KrnlAI.Sidecar.Tests/KrnlAI.Sidecar.Tests.csproj --configuration Release

  docker:
    needs: [test-community]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build KrnlAI.Sidecar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/KrnlAI.Sidecar/Dockerfile
          push: false
          tags: krnlai/sidecar:latest

  publish:
    needs: [desktop, sidecar, vscode]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish Desktop
        run: dotnet publish src/KrnlAI.Desktop.App -c Release -o artifacts/desktop -p:PublishSingleFile=true

      - name: Publish Sidecar
        run: dotnet publish src/KrnlAI.Sidecar -c Release -o artifacts/sidecar -p:PublishSingleFile=true

      - name: Package VsCode Extension
        run: |
          cd src/KrnlAI.VsCode
          npm ci
          npx tsc
          npx @vscode/vsce package -o ../../artifacts/krnlai-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: krnlai-artifacts
          path: artifacts/
